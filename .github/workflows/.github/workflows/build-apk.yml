name: Build JOOMI APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npx cap add android
      - run: npx cap copy android
      - run: |
          mkdir -p android/app/src/main/java/com/joomi/vpn
          cp custom_android/JoomiVpnService.java android/app/src/main/java/com/joomi/vpn/
          cp custom_android/MainActivity.java android/app/src/main/java/com/joomi/vpn/
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JOOMI-VPN-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
